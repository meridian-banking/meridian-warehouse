[project]
name = "meridian-warehouse"
version = "0.1.0"
description = "Dimensional warehouse models and loaders for the Meridian platform"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "pyarrow>=14.0",
    "psycopg2-binary>=2.9",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5.0"]
# pgserver (embedded Postgres for throwaway test databases) has no wheel on
# every platform; tests fall back to a TEST_DATABASE_URL when it is absent.
embedded-pg = ["pgserver>=0.1.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
